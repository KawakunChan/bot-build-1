name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o project.zip "$URL"
          mkdir -p project
          unzip -qq project.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate App Icons
        run: |
          if [ -f project/generate_icons.py ]; then
            pip install Pillow
            cd project
            python3 generate_icons.py
          fi

      - name: Setup Gradle Wrapper Permission
        run: chmod +x project/android/gradlew

      - name: Build APK Release
        working-directory: project/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: project/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
